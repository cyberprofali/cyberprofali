<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Md Ali — cybersecurity leadership with an adversary's mindset</title>
  <desc id="desc">Profile banner for Md Ali, vCISO, cybersecurity executive, professor, and researcher.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b14"/>
      <stop offset="0.52" stop-color="#0a1825"/>
      <stop offset="1" stop-color="#102332"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7dd3fc" stroke-opacity="0.065" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <path d="M0 315 C260 260 370 390 630 322 S970 260 1200 310 V360 H0Z" fill="#22d3ee" opacity="0.04"/>
  <circle cx="1060" cy="80" r="150" fill="#22d3ee" opacity="0.04" filter="url(#glow)"/>

  <rect x="54" y="48" width="5" height="264" rx="2.5" fill="url(#accent)"/>
  <circle cx="56.5" cy="48" r="7" fill="#22d3ee"/>
  <circle cx="56.5" cy="312" r="7" fill="#f59e0b"/>

  <text x="92" y="83" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="3">IDENTITY // ACTIVE</text>
  <text x="92" y="161" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="68" font-weight="760" letter-spacing="-2">MD ALI, PH.D.</text>
  <text x="94" y="205" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" font-weight="500">Cybersecurity leadership with an adversary's mindset</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" letter-spacing="1">
    <rect x="94" y="237" width="98" height="31" rx="15.5" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.42"/>
    <text x="143" y="258" text-anchor="middle" fill="#67e8f9">vCISO</text>
    <rect x="204" y="237" width="213" height="31" rx="15.5" fill="#2dd4bf" fill-opacity="0.09" stroke="#2dd4bf" stroke-opacity="0.38"/>
    <text x="310.5" y="258" text-anchor="middle" fill="#5eead4">OFFENSIVE SECURITY</text>
    <rect x="429" y="237" width="145" height="31" rx="15.5" fill="#f59e0b" fill-opacity="0.09" stroke="#f59e0b" stroke-opacity="0.38"/>
    <text x="501.5" y="258" text-anchor="middle" fill="#fbbf24">AI SECURITY</text>
    <rect x="586" y="237" width="138" height="31" rx="15.5" fill="#a78bfa" fill-opacity="0.09" stroke="#a78bfa" stroke-opacity="0.38"/>
    <text x="655" y="258" text-anchor="middle" fill="#c4b5fd">EDUCATION</text>
  </g>

  <text x="94" y="305" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">$ translate --from technical-risk --to defensible-action</text>

  <g transform="translate(976 226)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 57 L38 19 L76 57 L38 95 Z" stroke="#22d3ee" stroke-opacity="0.40" stroke-width="1.5"/>
    <path d="M38 19 L114 57 L76 95" stroke="#2dd4bf" stroke-opacity="0.30" stroke-width="1.5"/>
    <circle cx="0" cy="57" r="5" fill="#22d3ee" stroke="none"/>
    <circle cx="38" cy="19" r="5" fill="#67e8f9" stroke="none"/>
    <circle cx="76" cy="57" r="5" fill="#2dd4bf" stroke="none"/>
    <circle cx="38" cy="95" r="5" fill="#f59e0b" stroke="none"/>
    <circle cx="114" cy="57" r="5" fill="#a78bfa" stroke="none"/>
  </g>
</svg>

